services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8086:80"
    depends_on:
      mysql:
        condition: service_healthy

  ecommerce-registry:
    build: ./ecommerce-registry
    container_name: ecommerce-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql

  ecommerce-config:
    build: ./ecommerce-config
    container_name: ecommerce-config
    ports:
      - "8888:8888"
    depends_on:
      - ecommerce-registry
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  ecommerce-gateway:
    build: ./ecommerce-gateway
    container_name: ecommerce-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ecommerce-registry
    environment:
      - SPRING_PROFILES_ACTIVE=h2
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      - ecommerce-registry
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - JWT_SECRET=ecommerce-secret-key-that-is-at-least-32-chars-long-12345

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - ecommerce-registry
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      - ecommerce-registry
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      - ecommerce-registry
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8085:8085"
    depends_on:
      - ecommerce-registry
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  ecommerce-auth:
    build: ./ecommerce-auth
    container_name: ecommerce-auth
    ports:
      - "9000:9000"
    depends_on:
      - ecommerce-registry
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

volumes:
  mysql_data:
