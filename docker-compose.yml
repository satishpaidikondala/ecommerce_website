services:
  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_product_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
    ports:
      - "3308:3306"
    volumes:
      - mysql_order_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymentdb
    ports:
      - "3309:3306"
    volumes:
      - mysql_payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-cart:
    image: mysql:8.0
    container_name: mysql-cart
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cartdb
    ports:
      - "3310:3306"
    volumes:
      - mysql_cart_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce-phpmyadmin
    environment:
      PMA_HOST: mysql-user
      PMA_PORT: 3306
    ports:
      - "8086:80"
    depends_on:
      mysql-user:
        condition: service_healthy

  ecommerce-registry:
    build: ./ecommerce-registry
    container_name: ecommerce-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql

  ecommerce-config:
    build: ./ecommerce-config
    container_name: ecommerce-config
    ports:
      - "8888:8888"
    depends_on:
      - ecommerce-registry
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  ecommerce-gateway:
    build: ./ecommerce-gateway
    container_name: ecommerce-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ecommerce-registry
    environment:
      - SPRING_PROFILES_ACTIVE=h2
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      mysql-user:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-user:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - JWT_SECRET=ecommerce-secret-key-that-is-at-least-32-chars-long-12345

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      mysql-product:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-product:3306/productdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATA_REDIS_HOST=redis

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      mysql-order:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-order:3306/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_RABBITMQ_HOST=rabbitmq

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    depends_on:
      mysql-payment:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-payment:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_RABBITMQ_HOST=rabbitmq

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8085:8085"
    depends_on:
      mysql-cart:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-cart:3306/cartdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq

  ecommerce-auth:
    build: ./ecommerce-auth
    container_name: ecommerce-auth
    ports:
      - "9000:9000"
    depends_on:
      - ecommerce-registry
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8090:8090"
    depends_on:
      - ecommerce-registry
      - rabbitmq
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8091:8091"
    depends_on:
      - ecommerce-registry
      - rabbitmq
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq

  wishlist-service:
    build: ./wishlist-service
    container_name: wishlist-service
    ports:
      - "8092:8092"
    depends_on:
      mysql-cart:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-cart:3306/wishlistdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8093:8093"
    depends_on:
      mysql-product:
        condition: service_healthy
      ecommerce-registry:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-product:3306/reviewdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8094:8094"
    depends_on:
      - ecommerce-registry
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://ecommerce-registry:8761/eureka/

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:3
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ecommerce-gateway

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  minio:
    image: minio/minio
    container_name: ecommerce-minio
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # elasticsearch disabled for fast dev — uncomment to enable full-text search
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: ecommerce-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - es_data:/usr/share/elasticsearch/data

volumes:
  mysql_user_data:
  mysql_product_data:
  mysql_order_data:
  mysql_payment_data:
  mysql_cart_data:
  minio_data:
