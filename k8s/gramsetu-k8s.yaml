apiVersion: v1
kind: Namespace
metadata:
  name: gramsetu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-registry
  namespace: gramsetu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-registry
  template:
    metadata:
      labels:
        app: ecommerce-registry
    spec:
      containers:
      - name: registry
        image: gramsetu/ecommerce-registry:latest
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-registry
  namespace: gramsetu
spec:
  selector:
    app: ecommerce-registry
  ports:
  - port: 8761
    targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-gateway
  namespace: gramsetu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-gateway
  template:
    metadata:
      labels:
        app: ecommerce-gateway
    spec:
      containers:
      - name: gateway
        image: gramsetu/ecommerce-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: http://ecommerce-registry:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-gateway
  namespace: gramsetu
spec:
  type: LoadBalancer
  selector:
    app: ecommerce-gateway
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: gramsetu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: gramsetu/user-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "mysql"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-user:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gramsetu-ingress
  namespace: gramsetu
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: gramsetu.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecommerce-gateway
            port:
              number: 80
